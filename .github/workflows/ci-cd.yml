name: Heart Disease MLOps CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Flake8
      run: |
        flake8 src/ app.py tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Acquire Data and Train Model
      run: |
        python data/download_data.py
        python src/train.py

    - name: Run Unit Tests
      run: |
        pytest tests/ -v

    - name: Upload Trained Model Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-pipeline
        path: models/best_model.joblib